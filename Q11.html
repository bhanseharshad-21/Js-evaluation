<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <button id="patientCount">Add Patient</button>

    <script>
        let count = localStorage.getItem("pcount") || 0;

        document.getElementById("patientCount").addEventListener("click",()=>{
            let count = 0;

            count++;

            localStorage.setItem("pcount",count);

            alert("Patient count: ",count);
        })
    </script>
</body>
</html>
